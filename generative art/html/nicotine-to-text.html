<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicotine Timer</title>
    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #000000;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        input, button {
            font-family: monospace;
            font-size: 1rem;
            padding: 4px 8px;
            margin-right: 8px;
            margin-bottom: 16px;
            border: 1px solid #000;
            background: #fff;
            color: #000;
        }
        button:hover {
            background: #000;
            color: #fff;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <h2>Nicotine Timer</h2>
    
    <div>
        <label for="datetimeInput">Select past date & time:</label><br>
        <input type="datetime-local" id="datetimeInput">
        <button id="startBtn">Start</button>
        <button id="nowBtn">Now</button>
    </div>

    <div id="result"></div>

    <script>
        let intervalId = null;
        const STORAGE_KEY = 'timeLapsedTargetDate';
        const RUNNING_KEY = 'timeLapsedRunning';

        // Load saved state on page load
        function loadSavedState() {
            const savedDate = localStorage.getItem(STORAGE_KEY);
            const wasRunning = localStorage.getItem(RUNNING_KEY) === 'true';
            
            if (savedDate) {
                document.getElementById('datetimeInput').value = savedDate;
                refreshDisplay();
                if (wasRunning) {
                    // Auto-restart the live update
                    const targetDate = new Date(savedDate);
                    if (!isNaN(targetDate.getTime())) {
                        stopInterval();
                        intervalId = setInterval(() => {
                            document.getElementById('result').innerText = calculateTimeLapsed(targetDate);
                        }, 1000);
                    }
                }
            }
        }

        // Helper: convert a Date object to a string suitable for datetime-local input (local time)
        function toDateTimeLocalString(date) {
            const pad = (num) => String(num).padStart(2, '0');
            const year = date.getFullYear();
            const month = pad(date.getMonth() + 1);  // months are 0-indexed
            const day = pad(date.getDate());
            const hours = pad(date.getHours());
            const minutes = pad(date.getMinutes());
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function calculateTimeLapsed(targetDate) {
            const now = new Date();
            let diff = now - targetDate;

            if (diff < 0) {
                return "The selected time is in the future.";
            }

            // Calculations for breakdown
            const seconds = Math.floor(diff / 1000) % 60;
            const minutes = Math.floor(diff / (1000 * 60)) % 60;
            const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            
            // Approximate breakdown for days (total days, not mixed months/years)
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            return `Lapsed time:
${days} days
${hours} hours
${minutes} minutes
${seconds} seconds`;
        }

        // Function to stop any running interval
        function stopInterval() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        // Refresh the display based on current input value
        function refreshDisplay() {
            const inputVal = document.getElementById('datetimeInput').value;
            if (!inputVal) {
                document.getElementById('result').innerText = "Please select a valid date and time.";
                return;
            }

            const targetDate = new Date(inputVal);
            if (isNaN(targetDate.getTime())) {
                document.getElementById('result').innerText = "Invalid date. Please check your input.";
                return;
            }

            // Update immediately
            document.getElementById('result').innerText = calculateTimeLapsed(targetDate);
        }

        // Start button: begin live updating every second
        document.getElementById('startBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('datetimeInput').value;
            if (!inputVal) {
                document.getElementById('result').innerText = "Please select a valid date and time.";
                stopInterval();
                localStorage.setItem(RUNNING_KEY, 'false');
                return;
            }

            const targetDate = new Date(inputVal);
            if (isNaN(targetDate.getTime())) {
                document.getElementById('result').innerText = "Invalid date. Please check your input.";
                stopInterval();
                localStorage.setItem(RUNNING_KEY, 'false');
                return;
            }

            // Save state
            localStorage.setItem(STORAGE_KEY, inputVal);
            localStorage.setItem(RUNNING_KEY, 'true');

            // Stop any previous interval
            stopInterval();

            // Show immediate result
            document.getElementById('result').innerText = calculateTimeLapsed(targetDate);

            // Update every second
            intervalId = setInterval(() => {
                // Re-read target date from input? 
                // We keep the original target date because the input doesn't change,
                // but if user changes input after starting, they need to press Start again.
                // To be safe, we still use the targetDate captured at click time.
                const now = new Date();
                const diff = now - targetDate;
                if (diff < 0) {
                    // If the future message appears, we could keep updating but it will stay future.
                    // That's fine.
                }
                document.getElementById('result').innerText = calculateTimeLapsed(targetDate);
            }, 1000);
        });

        // Now button: set the datetime-local input to current local time and refresh display
        document.getElementById('nowBtn').addEventListener('click', () => {
            const now = new Date();
            // Set the input to current date and time (YYYY-MM-DDTHH:MM)
            const nowString = toDateTimeLocalString(now);
            document.getElementById('datetimeInput').value = nowString;
            
            // Save state
            localStorage.setItem(STORAGE_KEY, nowString);
            localStorage.setItem(RUNNING_KEY, 'true');

            // Stop any ongoing interval to avoid conflict, then update the result once
            stopInterval();
            refreshDisplay();

            // Optional: automatically restart the live update? 
            // The original behaviour only starts when "Start" is clicked. 
            // But we can provide a better UX: if interval was active, restart it? 
            // Simpler: just stop and show static result. 
            // Since we call stopInterval, the result is static. 
            // But the user might expect it to keep ticking. Let's decide: 
            // The "Now" button is meant to quickly set to current moment. 
            // Usually after setting to now, the lapsed time is 0 days, 0 hours, 0 minutes, 0 seconds.
            // It's more useful to see it ticking from that moment. 
            // So we can restart the interval if one was previously running? 
            // To keep it simple and consistent with the original design, 
            // we'll just refresh the display without starting a new interval.
            // But note: if an interval was running, we stopped it. That's fine.
            // The user can press "Start" again to begin live updates.
            // However, to make it more intuitive, let's start the interval automatically 
            // if there was an interval running before? We don't track that easily.
            // We'll implement a simple enhancement: after setting "Now", 
            // also start the live update (since it's a "now" context, ticking is expected).
            // But we must avoid double intervals.
            // We'll stop any existing interval, set the input, then start a fresh interval.
            // This matches the spirit of "now" button: instantly show live elapsed from this moment.
            // But careful: if user wants static, they can press Start again? No, Start will restart.
            // Let's go with auto-start for better UX: 
            // After setting Now, clear interval, then start a new one.
            // We need to capture the target date as a fixed date from the input string.
            // But note: "now" will change as time passes? No, we set the input to a specific moment.
            // We'll re-read targetDate from input.
            
            // Re-fetch the target date from input (which is now set to ~now)
            const inputVal = document.getElementById('datetimeInput').value;
            if (!inputVal) return;
            const targetDate = new Date(inputVal);
            if (isNaN(targetDate.getTime())) return;

            // Stop any interval and start fresh
            stopInterval();
            // Show immediate result
            document.getElementById('result').innerText = calculateTimeLapsed(targetDate);
            // Start updating every second
            intervalId = setInterval(() => {
                document.getElementById('result').innerText = calculateTimeLapsed(targetDate);
            }, 1000);
        });

        // Optional: if the user manually changes the input after starting, 
        // we don't auto-update to avoid confusion. They can press Start again.

        // Also stop interval if the page is unloaded (good practice, but not required)
        window.addEventListener('beforeunload', () => {
            stopInterval();
        });

        // Load saved state on page load
        loadSavedState();
    </script>

</body>
</html>
