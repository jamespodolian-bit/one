<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Art - Generative Patterns</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        #p5-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .info {
            text-align: center;
            max-width: 600px;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .mode-indicator {
            color: #667eea;
            font-weight: bold;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <h1>✨ Code Art Generator</h1>

    <div class="controls">
        <button onclick="setMode('circles')">Circles</button>
        <button onclick="setMode('lines')">Flow Lines</button>
        <button onclick="setMode('particles')">Particles</button>
        <button onclick="setMode('mandala')">Mandala</button>
        <button onclick="setMode('reset')">Reset</button>
    </div>

    <div class="mode-indicator">
        <span id="mode-display">Circles</span> | Press SPACE to randomize
    </div>

    <div id="p5-container"></div>

    <div class="info">
        <p><strong>Code Art in Action:</strong> This is a simple generative art sketch that creates different visual patterns.</p>
        <p>Each mode uses different algorithms to generate unique compositions. Click buttons or press SPACE to explore new variations.</p>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
