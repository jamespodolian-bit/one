<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dharma-kshanika — consciousness moment counter</title>
<style>
  :root {
    --face:      #0e0e0e;
    --face-2:    #1a1a1a;
    --ink:       #e6e6e6;
    --ink-dim:   #8f8f8f;
    --ink-faint: #5a5a5a;
    --hi:        #d4d4d4;
    --hi-2:      #6e6e6e;
    --lo:        #000000;
    --lo-2:      #2a2a2a;
  }

  * { box-sizing: border-box; }
  html { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 28px 16px;
    display: grid;
    place-items: center;
    background-color: #000;
    background-image: repeating-linear-gradient(
      0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    color: var(--ink);
    font-family: "MS Sans Serif", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: none;
  }

  /* ---------- win95 bevels (monochrome) ---------- */
  .raised {
    box-shadow:
      inset -1px -1px 0 var(--lo),
      inset  1px  1px 0 var(--hi),
      inset -2px -2px 0 var(--lo-2),
      inset  2px  2px 0 var(--hi-2);
  }
  .sunken {
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }

  /* ---------- window ---------- */
  .window {
    width: min(780px, 100%);
    background: var(--face);
    padding: 3px;
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 22px;
    padding: 0 3px 0 6px;
    background: linear-gradient(90deg, #000 0%, #262626 55%, #3d3d3d 100%);
    color: #fff;
    font-weight: bold;
    letter-spacing: .6px;
    user-select: none;
  }
  .titlebar .title { display: flex; align-items: center; gap: 7px; }
  .titlebar .glyph {
    width: 9px; height: 9px;
    background: #e6e6e6;
    animation: blink 1.6s steps(2, start) infinite;
  }
  @keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .15 } }

  .tb-buttons { display: flex; gap: 2px; }
  .tb-btn {
    width: 17px; height: 15px;
    display: grid;
    place-items: center;
    background: var(--face-2);
    color: var(--ink);
    font: 9px/1 "Lucida Console", "Courier New", monospace;
    box-shadow:
      inset -1px -1px 0 var(--lo),
      inset  1px  1px 0 var(--hi),
      inset -2px -2px 0 var(--lo-2),
      inset  2px  2px 0 var(--hi-2);
  }
  .tb-btn:active {
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }

  /* ---------- panel ---------- */
  .panel {
    padding: 14px 12px 12px;
    display: grid;
    gap: 14px;
  }

  fieldset {
    margin: 0;
    padding: 10px 12px 12px;
    border: 1px solid;
    border-color: #3a3a3a #6e6e6e #6e6e6e #3a3a3a;
    background: transparent;
  }
  legend {
    padding: 0 7px;
    color: var(--ink-dim);
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
  }

  .row { display: flex; gap: 8px; align-items: stretch; }

  input[type="datetime-local"] {
    flex: 1 1 auto;
    min-width: 0;
    background: #000;
    color: var(--ink);
    border: 0;
    padding: 6px 8px;
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 12px;
    color-scheme: dark;
    outline: none;
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }
  input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    opacity: .6;
    cursor: pointer;
  }

  select {
    flex: 1 1 auto;
    min-width: 0;
    background: #000;
    color: var(--ink);
    border: 0;
    padding: 6px 8px;
    font-family: "MS Sans Serif", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    font-size: 12px;
    color-scheme: dark;
    outline: none;
    cursor: pointer;
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }

  button {
    font: inherit;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--face-2);
    border: 0;
    padding: 7px 18px;
    cursor: pointer;
    box-shadow:
      inset -1px -1px 0 var(--lo),
      inset  1px  1px 0 var(--hi),
      inset -2px -2px 0 var(--lo-2),
      inset  2px  2px 0 var(--hi-2);
  }
  button:active {
    padding: 8px 17px 6px 19px;
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }
  button:focus-visible {
    outline: 1px dotted var(--ink);
    outline-offset: -5px;
  }

  /* ---------- readout ---------- */
  .readout {
    background: #000;
    padding: 16px 16px 14px;
    overflow: hidden;
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }

  .label {
    color: var(--ink-faint);
    font-size: 10px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .count {
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: clamp(17px, 3.9vw, 30px);
    line-height: 1.2;
    letter-spacing: .04em;
    word-break: break-all;
    min-height: 1.2em;
  }
  .count .sep { opacity: .22; }
  .count .t0  { opacity: 1; }
  .count .t1  { opacity: .70; }
  .count .t2  { opacity: .40; }
  .count .t3  { opacity: .16; }

  .sub {
    margin-top: 10px;
    color: var(--ink-dim);
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 11px;
    letter-spacing: .5px;
  }

  /* ---------- pulse ---------- */
  .pulse-block { display: grid; gap: 6px; }

  .pulse {
    height: 12px;
    background: #000;
    padding: 2px;
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi-2);
  }
  .pulse i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--hi);
  }

  .pulse-label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--ink-faint);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ---------- status bar ---------- */
  .statusbar {
    display: flex;
    gap: 3px;
    padding: 3px;
  }
  .statusbar > div {
    flex: 1 1 0;
    min-width: 0;
    padding: 4px 7px;
    color: var(--ink-dim);
    font-size: 10px;
    letter-spacing: .6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow:
      inset  1px  1px 0 var(--lo),
      inset -1px -1px 0 var(--hi-2),
      inset  2px  2px 0 var(--lo-2),
      inset -2px -2px 0 var(--hi);
  }
  .statusbar > div:last-child { flex: 0 0 auto; text-align: right; }

  @media (max-width: 520px) {
    .pulse-label { flex-direction: column; gap: 2px; }
    button { padding: 7px 12px; }
  }
</style>
</head>
<body>

<main class="window raised" role="application" aria-label="Consciousness moment counter">

  <div class="titlebar">
    <span class="title"><span class="glyph"></span>dharma-kshanika.exe</span>
    <span class="tb-buttons" aria-hidden="true">
      <span class="tb-btn">_</span>
      <span class="tb-btn">▫</span>
      <span class="tb-btn">×</span>
    </span>
  </div>

  <div class="panel">

    <fieldset>
      <legend>moment of awakening</legend>
      <div class="row">
        <input id="origin" type="datetime-local" step="1" aria-label="Moment of awakening">
        <button id="now" type="button">NOW</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>tradition</legend>
      <div class="row">
        <select id="tradition" aria-label="Buddhist tradition">
          <option value="prajnaparamita-60">Prajnaparamita Sastra (60/snap)</option>
          <option value="vibhasika-64">Vibhasika (64/snap)</option>
          <option value="theravada-60">Theravada Abhidharma (60/sec)</option>
          <option value="sautrantika-2">Sautrantika (2/moment)</option>
          <option value="yogacara-800">Yogacara (800/sec)</option>
          <option value="original-1b">Original (1 billion/sec)</option>
        </select>
      </div>
    </fieldset>

    <div class="readout">
      <div class="label">dharma moments constructed</div>
      <div class="count" id="count" aria-hidden="true">—</div>
      <div class="sub" id="human">awaiting a moment of awakening</div>
    </div>

    <div class="pulse-block">
      <div class="pulse" aria-hidden="true"><i id="pulse-fill"></i></div>
      <div class="pulse-label">
        <span>one second</span>
        <span id="moment-rate">800 consciousness moments</span>
      </div>
    </div>

  </div>

  <div class="statusbar">
    <div id="status-left">origin: —</div>
    <div id="status-right">sunyata</div>
  </div>

</main>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     Different traditions estimate dharma-kshanika duration differently:
     - Prajnaparamita: 60 moments per finger-snap (~75ms) = ~800/sec
     - Vibhasika: 64 moments per finger-snap = ~853/sec
     - Theravada: 60 moments per second
     - Sautrantika: 2 sub-moments per moment
     - Yogacara: ~800 moments per second
     - Original estimate: 1 billion per second
     ------------------------------------------------------------------ */
  var TRADITIONS = {
    'prajnaparamita-60': { label: 'Prajnaparamita Sastra', moments_per_sec: 800 },
    'vibhasika-64': { label: 'Vibhasika', moments_per_sec: 853 },
    'theravada-60': { label: 'Theravada Abhidharma', moments_per_sec: 60 },
    'sautrantika-2': { label: 'Sautrantika', moments_per_sec: 2 },
    'yogacara-800': { label: 'Yogacara', moments_per_sec: 800 },
    'original-1b': { label: 'Commentarial Expansion', moments_per_sec: 1e9 }
  };

  var YEAR_SECONDS   = 31556952; /* 365.2425 days */
  var MOMENTS_PER_MS = 0.8; /* default: 800/sec */
  var CURRENT_TRADITION = 'yogacara-800';

  var $origin = document.getElementById('origin');
  var $now    = document.getElementById('now');
  var $count  = document.getElementById('count');
  var $human  = document.getElementById('human');
  var $fill   = document.getElementById('pulse-fill');
  var $left   = document.getElementById('status-left');
  var $tradition = document.getElementById('tradition');

  var pad = function (n) { return String(n).padStart(2, '0'); };

  function toLocalInput(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  /* ---------- origin ---------- */
  var originMs = NaN;
  var lastDigits = '';

  function readOrigin() {
    var v = $origin.value;
    var t = v ? new Date(v).getTime() : NaN;
    originMs = isFinite(t) ? t : NaN;
    lastDigits = '';
    $left.textContent = isFinite(t)
      ? 'origin: ' + v.replace('T', ' ')
      : 'origin: —';
  }

  $origin.addEventListener('input', readOrigin);
  $origin.addEventListener('change', readOrigin);

  $now.addEventListener('click', function () {
    $origin.value = toLocalInput(new Date());
    readOrigin();
  });

  /* ---------- tradition selector ---------- */
  var $momentRate = document.getElementById('moment-rate');
  $tradition.addEventListener('change', function () {
    CURRENT_TRADITION = $tradition.value;
    var trad = TRADITIONS[CURRENT_TRADITION];
    MOMENTS_PER_MS = trad.moments_per_sec / 1000;
    $left.textContent = 'tradition: ' + trad.label;
    $momentRate.textContent = (trad.moments_per_sec >= 1e6
      ? (trad.moments_per_sec / 1e9).toFixed(1) + ' billion'
      : trad.moments_per_sec.toLocaleString()) + ' consciousness moments';
    lastDigits = '';
  });

  /* ---------- rendering ---------- */
  function setCount(text, sub) {
    if ($count.textContent !== text) $count.textContent = text;
    lastDigits = '';
    $human.textContent = sub;
  }

  function renderNumber(moments) {
    var whole = Math.floor(moments);
    if (!isFinite(whole)) { setCount('—', 'beyond conception'); return; }

    var s = BigInt(whole).toString();
    if (s === lastDigits) return;
    lastDigits = s;

    var n = s.length;
    var html = '';
    for (var i = 0; i < n; i++) {
      var fromRight = n - 1 - i;
      if (i > 0 && fromRight % 3 === 2) html += '<span class="sep">,</span>';
      var tier = fromRight < 6 ? 3 : fromRight < 12 ? 2 : fromRight < 18 ? 1 : 0;
      html += '<span class="t' + tier + '">' + s.charAt(i) + '</span>';
    }
    $count.innerHTML = html;
  }

  function renderHuman(ms) {
    var s = ms / 1000;
    var y = Math.floor(s / YEAR_SECONDS); s -= y * YEAR_SECONDS;
    var d = Math.floor(s / 86400);        s -= d * 86400;
    var h = Math.floor(s / 3600);         s -= h * 3600;
    var m = Math.floor(s / 60);           s -= m * 60;
    var sec = Math.floor(s);

    var parts = [];
    if (y) parts.push(y + 'y');
    if (y || d) parts.push(d + 'd');
    parts.push(pad(h) + ':' + pad(m) + ':' + pad(sec));

    $human.textContent = '≈ ' + parts.join(' ') + '  in conventual time';
  }

  /* ---------- loop ---------- */
  var t0     = performance.now();
  var epoch0 = Date.now();

  function tick() {
    var nowMs = epoch0 + (performance.now() - t0);
    var phase = (Date.now() % 1000) / 1000;   /* exact sub-second phase */

    if (!isFinite(originMs)) {
      setCount('—', 'awaiting a moment of awakening');
      $fill.style.width = '0%';
    } else {
      var elapsed = nowMs - originMs;

      if (elapsed < 0) {
        setCount('···', 'this moment has not yet arisen');
        $fill.style.width = '0%';
      } else {
        renderNumber(elapsed * MOMENTS_PER_MS);
        renderHuman(elapsed);
        $fill.style.width = (phase * 100).toFixed(2) + '%';
      }
    }

    requestAnimationFrame(tick);
  }

  /* ---------- boot: default origin = the unix epoch ---------- */
  $origin.value = toLocalInput(new Date(0));
  $tradition.value = CURRENT_TRADITION;
  var trad = TRADITIONS[CURRENT_TRADITION];
  $momentRate.textContent = trad.moments_per_sec.toLocaleString() + ' consciousness moments';
  $left.textContent = 'tradition: ' + trad.label;
  readOrigin();
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
